<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriPlan 24 — โปรแกรมวางแผนอาหาร 24 สัปดาห์</title>
<style>
:root{--bg:#0b1220;--card:#141d31;--card2:#1b2740;--line:#26334d;--txt:#e8edf7;--mut:#8b9ab5;
 --acc:#4ade80;--acc2:#38bdf8;--warn:#fbbf24;--dan:#f87171;--pur:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0b1220,#101a2e 60%,#0b1220);color:var(--txt);
 font-family:'Segoe UI','Sarabun',system-ui,sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:1300px;margin:0 auto}
header{text-align:center;margin-bottom:24px}
header h1{font-size:30px;letter-spacing:-.5px}
header h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mut);margin-top:6px;font-size:14px}
.grid{display:grid;grid-template-columns:390px 1fr;gap:20px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 i{width:8px;height:18px;background:var(--acc);border-radius:4px;display:inline-block}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
 padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:14px}
.sec>.st{font-size:12px;color:var(--acc2);font-weight:700;margin-bottom:4px}
button{width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;
 cursor:pointer;font-family:inherit;margin-top:12px;transition:.2s}
.btn1{background:linear-gradient(90deg,var(--acc),#22c55e);color:#04220f;font-size:15px;padding:13px}
.btn1:hover{filter:brightness(1.1)}
.btn2{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.p-acc{background:rgba(74,222,128,.15);color:var(--acc)}
.p-blue{background:rgba(56,189,248,.15);color:var(--acc2)}
.p-warn{background:rgba(251,191,36,.15);color:var(--warn)}
.p-pur{background:rgba(167,139,250,.15);color:var(--pur)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.stat{grid-template-columns:repeat(2,1fr)}}
.stat div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:21px;margin-bottom:2px}
.stat small{color:var(--mut);font-size:11px}
.bar{height:7px;background:#0d1626;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;border-radius:99px}
.meal{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.meal.bad{border-color:rgba(251,191,36,.5)}
.meal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.meal .mh b{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px}
td{padding:8px 4px;border-bottom:1px solid rgba(38,51,77,.5);vertical-align:top}
td:nth-child(n+2),th:nth-child(n+2){text-align:right}
td:first-child,th:first-child{text-align:left}
.dsc{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.supp{font-size:12px;color:var(--pur);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.box{border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px}
.box ul{margin-left:18px;line-height:1.85}
.b-warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 14px;background:var(--card2);border:1px solid var(--line);border-radius:10px;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);color:#04220f;font-weight:700;border-color:var(--acc)}
.tl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(38,51,77,.5);font-size:13px}
.tl b{min-width:118px;color:var(--acc2);font-size:12px}
.note{font-size:11.5px;color:var(--mut);line-height:1.75;margin-top:10px}
.dayttl{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dayttl i{width:8px;height:18px;background:var(--acc);border-radius:4px;display:inline-block}
#mrows{width:100%;border-collapse:separate;border-spacing:0 6px}
#mrows td{border:none;padding:0 4px}
#mrows input{padding:8px;font-size:13px;text-align:center}
#mrows .slot{font-size:13px;white-space:nowrap;text-align:left;padding-left:0}
.hide{display:none}
.dhide{display:none}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff;color:#000;padding:0}
  .wrap{max-width:none}
  header{margin-bottom:10px}
  header h1 span{color:#111;-webkit-text-fill-color:#111}
  header p{color:#444}
  .noprint{display:none!important}
  .grid{display:block}
  .dayblock{display:block!important;page-break-after:always;break-after:page}
  .dayblock:last-of-type{page-break-after:auto;break-after:auto}
  .card,.meal,.stat div{background:#fff!important;border:1px solid #bbb!important;color:#000!important}
  .card{margin-bottom:10px;border-radius:8px}
  .meal,.card{page-break-inside:avoid;break-inside:avoid}
  .note,.dsc,th,.stat small{color:#444!important}
  .supp{color:#333!important}
  .bar{display:none}
  .pill{border:1px solid #999;color:#000!important;background:#fff!important}
  .box.b-warn{background:#fff!important;border:1px solid #999!important}
  .dayttl i,.card h2 i{background:#000!important}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>NutriPlan <span>24</span></h1>
  <p>วางแผนชนิด จำนวน และปริมาณอาหารให้สอดคล้องกับเป้าหมายรายวันและรายมื้อ ตลอดโปรแกรม 24 สัปดาห์</p>
</header>

<div class="grid">
<!-- ================= INPUT ================= -->
<div class="noprint">
  <div class="card">
    <h2><i></i>1. ข้อมูลผู้ใช้งาน</h2>

    <label>สัปดาห์ปัจจุบัน (Week 1–24)</label>
    <select id="week"></select>
    <div id="pinfo" class="note"></div>

    <div class="sec">
      <div class="st">เป้าหมายรายวัน</div>
      <div class="row">
        <div><label>1.1 แคลอรี่/วัน (kcal)</label><input type="number" id="kcal" value="1400" min="800" max="4000" step="10"></div>
        <div><label>1.2 โปรตีนขั้นต่ำ/วัน (ก.)</label><input type="number" id="prot" value="110" min="40" max="300" step="1"></div>
      </div>
      <label>1.3 จำนวนมื้ออาหาร/วัน</label>
      <select id="meals"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
    </div>

    <div class="sec" style="border-color:rgba(56,189,248,.45)">
      <div class="st">1.4 กำหนดแคลอรี่และโปรตีนของแต่ละมื้อเอง</div>
      <table id="mrows"></table>
      <div id="msum" class="note"></div>
    </div>

    <div class="sec">
      <div class="st">1.5 องค์ประกอบร่างกาย และความชอบ</div>
      <label>ไขมันช่องท้อง (Visceral Fat Level)</label>
      <input type="number" id="vis" value="9" min="1" max="30" step="1">
      <div id="visnote" class="note"></div>
      <label>ชนิดโปรตีนที่ใช้</label>
      <select id="ptype">
        <option value="allplant" selected>ออลแพลนท์ — 80 kcal / โปรตีน 16 ก.</option>
        <option value="choco">ช็อกโกแลต — 85 kcal / โปรตีน 10 ก.</option>
        <option value="berry">เบอร์รี่ — 85 kcal / โปรตีน 10 ก.</option>
      </select>
      <div id="breakwrap" class="hide">
        <label>เลือกมื้อที่ใช้โปรตีน (ช่วงที่มีโปรตีนมื้อเดียว)</label>
        <select id="breakslot"><option value="เช้า">มื้อเช้า</option><option value="เย็น">มื้อเย็น</option></select>
      </div>
      <label>สไตล์อาหารปกติ</label>
      <select id="style">
        <option value="all" selected>ทั่วไป (เนื้อสัตว์ ปลา ไข่)</option>
        <option value="fish">เน้นปลา/อาหารทะเล</option>
        <option value="plant">มังสวิรัติ + ไข่/นม</option>
      </select>
    </div>

    <button class="btn1" onclick="run()">คำนวณแผนอาหาร</button>
    <button class="btn2" onclick="reroll()">สลับเมนูใหม่ (คงค่าเป้าหมายเดิม)</button>
    <button class="btn2" onclick="window.print()">พิมพ์แผนครบ 7 วัน / บันทึกเป็น PDF</button>
  </div>

  <div class="card">
    <h2><i></i>ตัวช่วยประเมินแคลอรี่ (ทางเลือก)</h2>
    <div class="row">
      <div><label>เพศ</label><select id="sex"><option value="m">ชาย</option><option value="f">หญิง</option></select></div>
      <div><label>อายุ (ปี)</label><input type="number" id="age" value="35"></div>
    </div>
    <div class="row">
      <div><label>น้ำหนัก (กก.)</label><input type="number" id="wt" value="80"></div>
      <div><label>ส่วนสูง (ซม.)</label><input type="number" id="ht" value="172"></div>
    </div>
    <label>ระดับกิจกรรม</label>
    <select id="act">
      <option value="1.2">นั่งทำงาน ไม่ออกกำลังกาย</option>
      <option value="1.375" selected>ออกกำลังกาย 1–3 วัน/สัปดาห์</option>
      <option value="1.55">ออกกำลังกาย 3–5 วัน/สัปดาห์</option>
      <option value="1.725">ออกกำลังกาย 6–7 วัน/สัปดาห์</option>
    </select>
    <button class="btn2" onclick="tdee()">คำนวณ TDEE แล้วใส่ค่ารายวันให้</button>
    <div id="tdeeout" class="note"></div>
  </div>
</div>

<!-- ================= OUTPUT ================= -->
<div id="out"></div>
</div>
</div>

<script>
/* ================= ผลิตภัณฑ์ ================= */
const BK={n:'บอดี้คีย์ มีลรีเพลสเมนต์',u:'ซอง',kcal:205,p:16,c:24};
const PK={
  allplant:{n:'โปรตีนออลแพลนท์',u:'ช้อน',kcal:80,p:16,c:2},
  choco:{n:'โปรตีนช็อกโกแลต',u:'ช้อน',kcal:85,p:10,c:8},
  berry:{n:'โปรตีนเบอร์รี่',u:'ช้อน',kcal:85,p:10,c:8}
};

/* ================= PERIODS =================
   bk2 : เช้า+เย็น = บอดี้คีย์ + โปรตีน
   bk1 : เช้า = บอดี้คีย์ + โปรตีน / เย็น = โปรตีนล้วน
   one : โปรตีนล้วนเพียงมื้อเดียว (เช้าหรือเย็น) ที่เหลืออาหารปกติ ไม่มีบอดี้คีย์  */
const PERIODS=[
 {id:1,name:'Priming',    w:[1,4],  mode:'bk2',desc:'มื้อเช้าและมื้อเย็นเป็นบอดี้คีย์ + โปรตีน หากแคลอรี่ไม่ถึงจะพ่วงอาหารปกติ'},
 {id:2,name:'Aggressive', w:[5,8],  mode:'bk2',desc:'มื้อเช้าและมื้อเย็นเป็นบอดี้คีย์ + โปรตีน หากแคลอรี่ไม่ถึงจะพ่วงอาหารปกติ'},
 {id:3,name:'Diet Break', w:[9,10], mode:'one',desc:'มีโปรตีนเพียงมื้อเดียว (เช้าหรือเย็น) มื้อที่เหลือเป็นอาหารปกติ ไม่มีบอดี้คีย์'},
 {id:4,name:'Second Wave',w:[11,16],mode:'bk1',desc:'มื้อเช้าเป็นบอดี้คีย์ + โปรตีน มื้อเย็นเป็นโปรตีน (ไม่มีบอดี้คีย์) หากแคลอรี่ไม่ถึงจะพ่วงอาหารปกติ'},
 {id:5,name:'Diet Break', w:[17,18],mode:'one',desc:'มีโปรตีนเพียงมื้อเดียว (เช้าหรือเย็น) มื้อที่เหลือเป็นอาหารปกติ ไม่มีบอดี้คีย์'},
 {id:6,name:'Polishing',  w:[19,22],mode:'bk1',desc:'มื้อเช้าเป็นบอดี้คีย์ + โปรตีน มื้อเย็นเป็นโปรตีน หากแคลอรี่ไม่ถึงจะพ่วงอาหารปกติ'},
 {id:7,name:'Lifestyle',  w:[23,24],mode:'one',desc:'มีโปรตีนเพียงมื้อเดียว (เช้าหรือเย็น) ไม่มีบอดี้คีย์ หากแคลอรี่ไม่ถึงจะพ่วงอาหารปกติ'}
];
const perOf=w=>PERIODS.find(p=>w>=p.w[0]&&w<=p.w[1]);

/* ================= เมนูอาหารปกติ (หาทานง่าย) ================= */
const M=(n,d,kcal,p,c,tag,diet,egg=0,rice=0)=>({n,d,kcal,p,c,tag,diet,egg,rice});
const MENUS=[
 M('ข้าวไข่ต้ม','ข้าวสวย 1 ทัพพี + ไข่ต้ม 2 ฟอง',220,14,18,'main','egg',2,1),
 M('ข้าวต้มปลา','ข้าวต้ม 1 ถ้วย + เนื้อปลา 80 ก.',260,22,30,'main','fish',0,1),
 M('ข้าวต้มไก่ฉีก','ข้าวต้ม 1 ถ้วย + อกไก่ฉีก 80 ก.',250,20,32,'main','meat',0,1),
 M('ข้าวไข่เจียว','ไข่เจียว 2 ฟอง (น้ำมันน้อย) + ข้าวสวย 1 ทัพพี',300,15,30,'main','egg',2,1),
 M('ข้าวกล้องอกไก่ย่าง','อกไก่ย่าง 100 ก. + ข้าวกล้อง 1 ทัพพี',245,32,17,'main','meat',0,1),
 M('ข้าวกล้องหมูสันในย่าง','หมูสันใน 100 ก. + ข้าวกล้อง 1 ทัพพี',225,28,17,'main','meat',0,1),
 M('ก๋วยเตี๋ยวต้มยำน้ำใส','เส้นเล็ก 1 ชาม + ลูกชิ้นปลา/หมูสับ',300,20,38,'main','meat',0,1),
 M('ก๋วยเตี๋ยวเส้นบุกลูกชิ้นปลา','เส้นบุก 1 ชาม + ลูกชิ้นปลา 6 ลูก',150,16,8,'main','fish',0,1),
 M('ต้มจืดเต้าหู้หมูสับ','1 ถ้วย เต้าหู้ไข่ + หมูสับ',150,14,7,'main','meat'),
 M('แกงจืดตำลึงหมูสับ','1 ถ้วยใหญ่',130,13,6,'main','meat'),
 M('ต้มจืดมะระยัดไส้','1 ถ้วย หมูสับ',160,15,8,'main','meat'),
 M('ต้มยำกุ้งน้ำใส','กุ้ง 100 ก. + เห็ดฟาง',120,18,7,'main','fish'),
 M('แกงส้มผักรวมกุ้ง','1 ถ้วย',150,16,12,'main','fish'),
 M('แกงเลียงกุ้งสด','1 ถ้วย',140,14,14,'main','fish'),
 M('ปลานึ่งมะนาว','ปลากะพง 120 ก.',180,30,5,'main','fish'),
 M('ปลาทูย่าง + น้ำพริกผักลวก','ปลาทู 1 ตัว + ผักลวก',210,20,10,'main','fish'),
 M('ไก่ย่าง + ส้มตำไทย','อกไก่ย่าง 100 ก. + ส้มตำไม่ใส่ถั่ว',260,28,18,'main','meat'),
 M('สลัดอกไก่น้ำใส','อกไก่ 100 ก. + ผักสลัด',200,28,10,'main','meat'),
 M('สลัดทูน่าน้ำแร่','ทูน่า 1 กระป๋อง + ผักสลัด',180,24,8,'main','fish'),
 M('ยำวุ้นเส้นกุ้งสด','วุ้นเส้น 1 จาน + กุ้ง 80 ก.',180,16,22,'main','fish',0,1),
 M('ผัดผักรวมใส่กุ้ง','ผักรวม 1 จาน + กุ้ง 80 ก.',170,16,10,'main','fish'),
 M('อกไก่นึ่งมะนาว + ผักลวก','อกไก่ 100 ก.',190,30,6,'main','meat'),
 M('หมูสันในย่างจิ้มแจ่ว','หมูสันใน 100 ก. + ผักสด',190,28,4,'main','meat'),
 M('อกไก่ผัดพริกไทยดำ + ข้าวกล้อง','อกไก่ 100 ก. + ข้าวกล้อง 1 ทัพพี',280,32,20,'main','meat',0,1),
 M('ไข่ตุ๋นทรงเครื่อง','ไข่ 2 ฟอง + หมูสับเล็กน้อย',150,13,4,'main','egg',2),
 M('ยำไข่ต้ม','ไข่ต้ม 2 ฟอง + ผักสด',160,13,6,'main','egg',2),
 M('เต้าหู้ผัดผักรวม','เต้าหู้แข็ง 100 ก. + ผักรวม',160,12,9,'main','plant'),
 M('ซุปฟักทองอกไก่ฉีก','1 ถ้วย',180,18,18,'main','meat'),
 M('ไข่ต้ม 2 ฟอง + ฝรั่ง','ของว่าง',180,13,10,'snack','egg',2),
 M('ไข่ขาวต้ม 4 ฟอง + ฝรั่ง','ของว่างโปรตีนสูง',110,15,10,'snack','egg',2),
 M('กรีกโยเกิร์ต 0% + ผลไม้รวม','1 ถ้วยเล็ก',130,11,18,'snack','plant'),
 M('นมพร่องมันเนย + ไข่ต้ม 1 ฟอง','นม 200 มล.',160,13,11,'snack','plant',1),
 M('อกไก่ฉีก + แตงกวา','อกไก่ 70 ก.',120,22,3,'snack','meat'),
 M('อัลมอนด์ 10 เม็ด + ส้ม 1 ผล','ของว่าง',130,3,21,'snack','plant'),
 M('นมถั่วเหลืองไม่หวาน + กล้วย','1 กล่อง + กล้วย 1 ผล',170,8,28,'snack','plant')
];
const dietOK=(m,s)=>s==='all'?true:s==='fish'?['fish','plant','egg'].includes(m.diet):['plant','egg'].includes(m.diet);

/* ================= UTILS ================= */
let SEED=1, USED={};
const r0=x=>Math.round(x), r1=x=>Math.round(x*10)/10;
const SLOTSET={2:['เช้า','เย็น'],3:['เช้า','กลางวัน','เย็น'],4:['เช้า','กลางวัน','ว่างบ่าย','เย็น'],
 5:['เช้า','ว่างเช้า','กลางวัน','ว่างบ่าย','เย็น'],6:['เช้า','ว่างเช้า','กลางวัน','ว่างบ่าย','เย็น','ว่างค่ำ']};
const DEF={'เช้า':[350,30],'ว่างเช้า':[150,12],'กลางวัน':[450,35],'ว่างบ่าย':[150,12],'เย็น':[350,30],'ว่างค่ำ':[120,10]};
const isSnackSlot=s=>s.startsWith('ว่าง');
const jit=n=>((n.charCodeAt(0)+n.length*7+SEED*13)%7)*6;

/* ========== เลือกเมนูอาหารปกติ (1–2 เมนู) ========== */
function pickMenus(cfg,st,tK,tP,snack,maxItems){
  const ok=m=>dietOK(m,cfg.style);
  const mains=MENUS.filter(m=>m.tag==='main'&&ok(m));
  const snacks=MENUS.filter(m=>m.tag==='snack'&&ok(m));
  const primary=snack?snacks.concat(mains.filter(m=>m.kcal<=200)):mains;
  const side=snacks.concat(mains.filter(m=>m.kcal<=210));
  const cands=[];
  primary.forEach(m=>[1,1.5].forEach(q=>{ if(st.eggs+m.egg*q<=4) cands.push([{m,q}]); }));
  if(maxItems>=2) primary.forEach(a=>side.forEach(b=>{
    if(a.n===b.n||(a.rice&&b.rice)) return;
    [1,0.5].forEach(q=>{ if(st.eggs+a.egg+b.egg*q<=4) cands.push([{m:a,q:1},{m:b,q}]); });
  }));
  let best=null;
  cands.forEach(cb=>{
    let K=0,P=0,C=0,rep=0;
    cb.forEach(x=>{K+=x.m.kcal*x.q;P+=x.m.p*x.q;C+=x.m.c*x.q;
      rep+=(USED[x.m.n]||0)*22+(st.today.has(x.m.n)?80:0)+jit(x.m.n);});
    const carbPen=Math.max(0,C-st.carbLeft)*2.2;
    const s=Math.abs(K-tK)+Math.max(0,tP-P)*9+Math.max(0,P-tP-18)*0.6+carbPen+rep+cb.length*4;
    if(!best||s<best.s) best={s,cb,K,P,C};
  });
  if(!best) return null;
  best.cb.forEach(x=>{USED[x.m.n]=(USED[x.m.n]||0)+1;st.today.add(x.m.n);st.eggs+=x.m.egg*x.q;});
  st.carbLeft-=best.C;
  return best;
}

/* ========== วางแผน 1 วัน ========== */
function planDay(day,cfg){
  const st={eggs:0,carbLeft:cfg.carbG,today:new Set()};
  const per=cfg.per, pk=PK[cfg.ptype];
  const baseMap={};
  if(per.mode==='bk2'){baseMap['เช้า']=true;baseMap['เย็น']=true;}
  else if(per.mode==='bk1'){baseMap['เช้า']=true;baseMap['เย็น']=false;}
  else baseMap[cfg.breakSlot]=false;

  const meals=[];
  cfg.slots.forEach(s=>{
    const tK=s.kcal, tP=s.prot;
    if(s.slot in baseMap){
      const useBK=baseMap[s.slot];
      let bs=null;
      for(let n=(useBK?0:1);n<=(useBK?2:3);n++){
        const k=(useBK?BK.kcal:0)+pk.kcal*n, p=(useBK?BK.p:0)+pk.p*n, c=(useBK?BK.c:0)+pk.c*n;
        const sc=Math.max(0,tP-p)*8+Math.max(0,k-tK)*1.4+Math.max(0,tK-k)*0.22+n*0.5;
        if(!bs||sc<bs.sc) bs={sc,n,k,p,c};
      }
      const items=[];
      if(useBK) items.push({n:BK.n,q:1,u:BK.u,kcal:BK.kcal,p:BK.p,c:BK.c});
      if(bs.n>0) items.push({n:pk.n,q:bs.n,u:pk.u,kcal:pk.kcal*bs.n,p:pk.p*bs.n,c:pk.c*bs.n});
      let K=bs.k,P=bs.p,C=bs.c,topped=false;
      st.carbLeft-=C;
      if(tK-K>60||tP-P>2){
        const add=pickMenus(cfg,st,Math.max(0,tK-K),Math.max(0,tP-P),true,1);
        if(add){add.cb.forEach(x=>items.push({n:x.m.n,d:x.m.d,q:x.q,u:'ที่',kcal:x.m.kcal*x.q,p:x.m.p*x.q,c:x.m.c*x.q}));
          K+=add.K;P+=add.P;C+=add.C;topped=true;}
      }
      meals.push({slot:s.slot,type:'shake',bk:useBK,scoops:bs.n,items,K,P,C,topped,tK,tP});
    }else{
      const r=pickMenus(cfg,st,tK,tP,isSnackSlot(s.slot),2);
      const items=r?r.cb.map(x=>({n:x.m.n,d:x.m.d,q:x.q,u:'ที่',kcal:x.m.kcal*x.q,p:x.m.p*x.q,c:x.m.c*x.q})):[];
      meals.push({slot:s.slot,type:'normal',items,K:r?r.K:0,P:r?r.P:0,C:r?r.C:0,tK,tP});
    }
  });
  const K=meals.reduce((a,m)=>a+m.K,0),P=meals.reduce((a,m)=>a+m.P,0),C=meals.reduce((a,m)=>a+m.C,0);
  return {meals,K,P,C,eggs:st.eggs};
}

/* ========== อาหารเสริมรายมื้อ ========== */
function suppFor(slot,type){
  const s=[];
  if(slot==='เช้า') s.push('ดับเบิ้ลเอ็กซ์ 1 ชุด (หลังอาหาร)','ลิวิท็อกซ์ (หลังอาหาร)','น้ำมันปลา 1 เม็ด (หลังอาหาร)');
  if(slot==='กลางวัน') s.push('น้ำมันปลา 1 เม็ด (ก่อนอาหาร)');
  if(slot==='เย็น') s.push('ดับเบิ้ลเอ็กซ์ 1 ชุด (หลังอาหาร)','ลิวิท็อกซ์ (หลังอาหาร)');
  if(type==='normal') s.push('เลซิตินอี 3 เม็ด (หลังอาหาร)');
  return s;
}

/* ================= RUN & RENDER ================= */
let CFG=null,DAYS=[];
function readSlots(){
  return SLOTSET[+meals.value].map(s=>({slot:s,
    kcal:+document.getElementById('k_'+s).value, prot:+document.getElementById('p_'+s).value}));
}
function run(){
  const w=+week.value,per=perOf(w),v=+vis.value;
  const pct=v>12?0.18:v>=10?0.25:0.40;
  CFG={week:w,per,kcal:+kcal.value,prot:+prot.value,slots:readSlots(),vis:v,
       carbPct:pct,carbG:(+kcal.value)*pct/4,ptype:ptype.value,style:style.value,breakSlot:breakslot.value};
  USED={};
  DAYS=[0,1,2,3,4,5,6].map(d=>planDay(d,CFG));
  renderAll(0); save();
}
const reroll=()=>{SEED+=3;run();};

/* ---------- สร้างบล็อกของแต่ละวัน ---------- */
function dayBlock(p,idx){
  const c=CFG,per=c.per;
  const kC=p.K>c.kcal*1.05?'var(--dan)':p.K<c.kcal*0.9?'var(--warn)':'var(--acc)';
  const pC=p.P<c.prot?'var(--warn)':'var(--acc)';
  const W=[];
  const sumK=c.slots.reduce((a,s)=>a+s.kcal,0), sumP=c.slots.reduce((a,s)=>a+s.prot,0);
  if(Math.abs(sumK-c.kcal)>50) W.push(`ผลรวมแคลอรี่รายมื้อ ${sumK} kcal ต่างจากเป้าหมายรายวัน ${c.kcal} kcal อยู่ ${r0(Math.abs(sumK-c.kcal))} kcal — ปรับค่าในข้อ 1.4 ให้สอดคล้องกัน`);
  if(sumP<c.prot) W.push(`ผลรวมโปรตีนรายมื้อ ${sumP} ก. ต่ำกว่าเป้าหมายรายวัน ${c.prot} ก.`);
  p.meals.forEach(m=>{
    if(m.P<m.tP-1.5) W.push(`มื้อ${m.slot}: โปรตีน ${r1(m.P)} ก. ต่ำกว่าที่กำหนด ${m.tP} ก. — เพิ่มไข่ขาวต้ม 2 ฟอง (+7 ก. / 34 kcal) หรืออกไก่ฉีก 50 ก. (+15 ก. / 82 kcal)`);
    if(m.K<m.tK-50) W.push(`มื้อ${m.slot}: พลังงาน ${r0(m.K)} kcal ต่ำกว่าที่กำหนด ${m.tK} kcal — เพิ่มข้าวสวยครึ่งทัพพี (+40) หรือไข่ต้ม 1 ฟอง (+70)`);
    if(m.K>m.tK+70) W.push(`มื้อ${m.slot}: พลังงาน ${r0(m.K)} kcal เกินที่กำหนด ${m.tK} kcal — ลดข้าวลงครึ่งทัพพี`);
    if(m.bk&&m.scoops>2) W.push(`มื้อ${m.slot}: บอดี้คีย์ + โปรตีน ${m.scoops} ช้อน จะหนืดเกินไป`);
    if(m.type==='shake'&&!m.bk&&m.scoops>3) W.push(`มื้อ${m.slot}: โปรตีนเกิน 3 ช้อน ทานยาก ควรแบ่งเป็น 2 ครั้ง`);
  });
  if(p.C>c.carbG) W.push(`คาร์บรวม ${r0(p.C)} ก. เกินโควตา ${r0(c.carbG)} ก. — ลดข้าวหรือเส้นในมื้อที่มีเมนูข้าว`);
  if(c.vis>10) W.push(`ไขมันช่องท้องระดับ ${c.vis} (เกิน 10): จำกัดคาร์บที่ ~<b>${r0(c.carbG)} ก./วัน</b> (${r0(c.carbPct*100)}% ของพลังงาน) และจัดคาร์บไว้รอบการออกกำลังกาย`);
  if(p.eggs>=4) W.push('ใช้ไข่ครบโควตา 4 ฟอง/วันแล้ว — วันถัดไปควรสลับเป็นปลาหรืออกไก่เพื่อกระจายสารอาหาร');

  let h=`<div class="card dayblock ${idx===0?'':'dhide'}" id="day${idx}">
    <div class="dayttl"><i></i>แผนอาหาร วันที่ ${idx+1}</div>
    <div style="margin-bottom:12px">
      <span class="pill p-blue">Week ${c.week}</span>
      <span class="pill p-acc" style="margin-left:6px">Period ${per.id} · ${per.name}</span>
      <span class="pill p-pur" style="margin-left:6px">${c.slots.length} มื้อ/วัน</span>
      <span class="pill ${c.vis>10?'p-warn':'p-acc'}" style="margin-left:6px">Visceral ${c.vis}</span>
      <div class="note">${per.desc}</div>
    </div>
    <div class="stat">
      <div><b style="color:${kC}">${r0(p.K)}</b><small>kcal · เป้า ${c.kcal}</small>
        <div class="bar"><div style="width:${Math.min(100,p.K/c.kcal*100)}%;background:${kC}"></div></div></div>
      <div><b style="color:${pC}">${r0(p.P)} ก.</b><small>โปรตีน · ขั้นต่ำ ${c.prot}</small>
        <div class="bar"><div style="width:${Math.min(100,p.P/c.prot*100)}%;background:${pC}"></div></div></div>
      <div><b>${r0(p.C)} ก.</b><small>คาร์บ · โควตา ${r0(c.carbG)}</small>
        <div class="bar"><div style="width:${Math.min(100,p.C/c.carbG*100)}%;background:${p.C>c.carbG?'var(--dan)':'var(--acc2)'}"></div></div></div>
      <div><b>${r0(p.P*4/p.K*100)}%</b><small>พลังงานจากโปรตีน</small>
        <div class="bar"><div style="width:${Math.min(100,p.P*4/p.K*200)}%;background:var(--pur)"></div></div></div>
    </div>
    ${W.length?`<div class="box b-warn"><b>ข้อควรระวัง / คำแนะนำปรับจูน</b><ul>${W.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}`;

  p.meals.forEach(m=>{
    const okK=m.K>=m.tK-50&&m.K<=m.tK+70, okP=m.P>=m.tP-1.5, sup=suppFor(m.slot,m.type);
    const tag=m.type==='shake'
      ? `<span class="pill p-acc">${m.bk?'บอดี้คีย์ + โปรตีน':'โปรตีน'}${m.topped?' + อาหารปกติ':''}</span>`
      : '<span class="pill p-blue">อาหารปกติ</span>';
    h+=`<div class="meal ${(okK&&okP)?'':'bad'}">
      <div class="mh"><b>มื้อ${m.slot}</b>
        <span>${tag}
          <span class="pill ${okK?'p-acc':'p-warn'}" style="margin-left:6px">${r0(m.K)} / ${m.tK} kcal</span>
          <span class="pill ${okP?'p-acc':'p-warn'}" style="margin-left:6px">โปรตีน ${r1(m.P)} / ${m.tP} ก.</span>
        </span>
      </div>
      <table><tr><th>รายการ</th><th>ปริมาณ</th><th>kcal</th><th>โปรตีน</th><th>คาร์บ</th></tr>
      ${m.items.map(i=>`<tr><td>${i.n}${i.d?`<span class="dsc">${i.d}</span>`:''}</td>
        <td>${r1(i.q)} ${i.u}</td><td>${r0(i.kcal)}</td><td>${r1(i.p)} ก.</td><td>${r1(i.c)} ก.</td></tr>`).join('')}
      </table>
      ${sup.length?`<div class="supp">${sup.join(' · ')}</div>`:''}
    </div>`;
  });
  return h+`</div>`;
}

/* ---------- ประกอบผลลัพธ์ทั้งหมด ---------- */
function renderAll(day){
  let h=`<div class="card noprint" style="padding:14px 18px;margin-bottom:14px">
    <div class="tabs">${DAYS.map((_,i)=>`<div class="tab ${i===day?'on':''}" id="tab${i}" onclick="showDay(${i})">วันที่ ${i+1}</div>`).join('')}</div>
    <div class="note">หน้าจอแสดงทีละวัน · เมื่อสั่งพิมพ์หรือบันทึก PDF จะได้แผนครบทั้ง 7 วัน โดยขึ้นหน้าใหม่ทุกวัน</div>
  </div>`;
  h+=DAYS.map((p,i)=>dayBlock(p,i)).join('');
  h+=`<div class="card">
    <h2><i></i>ตารางอาหารเสริมประจำวัน (ตลอด 24 สัปดาห์)</h2>
    <div class="tl"><b>หลังตื่นนอน</b><span>นิวทรีไลท์ บีกิน 1 ซอง + ไฟเบอร์พลัส 1 ซอง + โพรไบโอติก 1 ซอง พร้อมน้ำ 1 แก้วใหญ่</span></div>
    <div class="tl"><b>หลังอาหารเช้า</b><span>ดับเบิ้ลเอ็กซ์ 1 ชุด + ลิวิท็อกซ์ + น้ำมันปลา 1 เม็ด</span></div>
    <div class="tl"><b>ก่อนอาหารกลางวัน</b><span>น้ำมันปลา 1 เม็ด</span></div>
    <div class="tl"><b>หลังอาหารมื้อปกติ</b><span>เลซิตินอี 3 เม็ด (เฉพาะมื้อที่ไม่ใช่บอดี้คีย์หรือโปรตีน)</span></div>
    <div class="tl"><b>หลังอาหารเย็น</b><span>ดับเบิ้ลเอ็กซ์ 1 ชุด + ลิวิท็อกซ์</span></div>
    <div class="note">ค่าพลังงานและโปรตีนของผลิตภัณฑ์อ้างอิงตามที่ผู้ใช้ระบุ ค่าของเมนูอาหารเป็นค่าประมาณจากปริมาณเสิร์ฟมาตรฐาน · 
    เครื่องมือนี้ใช้ช่วยคำนวณเชิงโภชนาการทั่วไป ไม่ใช่คำแนะนำทางการแพทย์ ผู้มีโรคประจำตัว ตั้งครรภ์ ให้นมบุตร หรือใช้ยาประจำ ควรปรึกษาแพทย์หรือนักกำหนดอาหารก่อนเริ่มโปรแกรม</div>
  </div>`;
  out.innerHTML=h;
}
function showDay(i){
  DAYS.forEach((_,k)=>{
    document.getElementById('day'+k).classList.toggle('dhide',k!==i);
    document.getElementById('tab'+k).classList.toggle('on',k===i);
  });
}

/* ================= UI ================= */
function buildRows(){
  const slots=SLOTSET[+meals.value], old={};
  document.querySelectorAll('#mrows input').forEach(i=>old[i.id]=i.value);
  const per=perOf(+week.value);
  const baseSlots = per.mode==='one'?[breakslot.value]:['เช้า','เย็น'];
  mrows.innerHTML=`<tr><th style="text-align:left">มื้อ</th><th style="text-align:center">kcal</th><th style="text-align:center">โปรตีน (ก.)</th></tr>`+
   slots.map(s=>{
     const mark=baseSlots.includes(s)?'<span class="pill p-acc" style="margin-left:5px">โปรตีน</span>':'';
     return `<tr><td class="slot">${s}${mark}</td>
       <td><input type="number" id="k_${s}" value="${old['k_'+s]||DEF[s][0]}" step="10"></td>
       <td><input type="number" id="p_${s}" value="${old['p_'+s]||DEF[s][1]}" step="1"></td></tr>`;
   }).join('');
  document.querySelectorAll('#mrows input').forEach(i=>i.addEventListener('change',sumRows));
  sumRows();
}
function sumRows(){
  const slots=SLOTSET[+meals.value];
  let sk=0,sp=0;
  slots.forEach(s=>{sk+=+document.getElementById('k_'+s).value;sp+=+document.getElementById('p_'+s).value;});
  const dk=sk-(+kcal.value), dp=sp-(+prot.value);
  msum.innerHTML=`รวมรายมื้อ: <b>${sk} kcal</b> / โปรตีน <b>${sp} ก.</b> · 
   เทียบเป้าหมายรายวัน: <span style="color:${Math.abs(dk)>50?'var(--warn)':'var(--acc)'}">${dk>0?'+':''}${dk} kcal</span> ·
   <span style="color:${dp<0?'var(--warn)':'var(--acc)'}">${dp>0?'+':''}${dp} ก.</span>`;
}
function tdee(){
  const W=+wt.value,H=+ht.value,A=+age.value,S=sex.value,ACT=+act.value;
  const bmr=10*W+6.25*H-5*A+(S==='m'?5:-161), t=bmr*ACT;
  const target=Math.round(t*0.78/10)*10, pr=Math.round(W*1.8);
  kcal.value=target; prot.value=pr; sumRows();
  tdeeout.innerHTML=`BMR ≈ <b>${r0(bmr)}</b> kcal · TDEE ≈ <b>${r0(t)}</b> kcal<br>
   เป้าหมายลดไขมัน (ขาดดุล ~22%) = <b>${target}</b> kcal · โปรตีน <b>${pr}</b> ก. (1.8 ก./กก.) — ใส่ค่ารายวันให้แล้ว ปรับรายมื้อในข้อ 1.4 ได้เลย`;
}
function save(){
  const d={w:week.value,k:kcal.value,p:prot.value,m:meals.value,v:vis.value,t:ptype.value,
    s:style.value,b:breakslot.value,rows:{}};
  document.querySelectorAll('#mrows input').forEach(i=>d.rows[i.id]=i.value);
  localStorage.setItem('nutriplan24',JSON.stringify(d));
}
function upd(){
  const p=perOf(+week.value);
  pinfo.innerHTML=`<span class="pill p-acc">Period ${p.id} · ${p.name}</span> ${p.desc}`;
  breakwrap.className=p.mode==='one'?'':'hide';
  const v=+vis.value;
  visnote.innerHTML=v>12?'<span style="color:var(--dan)">ระดับสูงมาก → จำกัดคาร์บ 18% ของพลังงาน เน้นโปรตีนและไขมันดี</span>'
    :v>=10?'<span style="color:var(--warn)">เกินเกณฑ์ (มากกว่า 10) → จำกัดคาร์บ 25% ของพลังงาน</span>'
    :'<span style="color:var(--acc)">อยู่ในเกณฑ์ปกติ → คาร์บ 40% ของพลังงาน</span>';
  buildRows();
}

/* ================= INIT ================= */
(function init(){
  for(let w=1;w<=24;w++){const p=perOf(w);week.innerHTML+=`<option value="${w}">Week ${w} — P${p.id} ${p.name}</option>`;}
  const s=JSON.parse(localStorage.getItem('nutriplan24')||'null');
  if(s){week.value=s.w;kcal.value=s.k;prot.value=s.p;meals.value=s.m;vis.value=s.v;
        ptype.value=s.t;style.value=s.s;breakslot.value=s.b;}
  ['week','vis','meals','breakslot'].forEach(id=>document.getElementById(id).addEventListener('change',upd));
  ['kcal','prot'].forEach(id=>document.getElementById(id).addEventListener('change',sumRows));
  upd();
  if(s&&s.rows) Object.entries(s.rows).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v;});
  sumRows(); run();
})();
</script>
</body>
